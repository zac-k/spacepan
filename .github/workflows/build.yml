name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            pluginval-bin: ./pluginval
            run: xvfb-run -a
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            pluginval-bin: ./pluginval.app/Contents/MacOS/pluginval
            run: ""
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip
            pluginval-bin: ./pluginval.exe
            run: ""

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxcomposite-dev libgl1-mesa-dev ninja-build xvfb

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        run: ${{ matrix.run }} build/Tests/SpacePanTests_artefacts/Release/SpacePanTests

      - name: Validate with pluginval
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          ${{ matrix.run }} ${{ matrix.pluginval-bin }} --strictness-level 10 --validate-in-process \
            --validate build/SpacePan_artefacts/Release/VST3/SpacePan.vst3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SpacePan-${{ matrix.name }}
          path: |
            build/SpacePan_artefacts/Release/VST3
            build/SpacePan_artefacts/Release/AU
            build/SpacePan_artefacts/Release/Standalone
          if-no-files-found: error
